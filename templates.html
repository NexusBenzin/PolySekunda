<!DOCTYPE html>
<html>
  <head>
    <title>PolySekunda</title>
    <style>

      /* ---- BASE ---- */
      * { box-sizing: border-box; }
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
      }

      /* ---- NAVBAR ---- */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 14px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        border: 1px solid #e0e0e0;
      }
      .navbar h1 { margin: 0; font-size: 20px; }
      .user-info { font-size: 14px; color: #555; display: flex; align-items: center; gap: 8px; }
      .user-info strong { color: #222; }

      /* ---- CARDS ---- */
      .card {
        background: white;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 14px;
      }
      .card h2 { margin: 0 0 12px; font-size: 16px; }

      /* ---- BUTTONS ---- */
      button {
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid #ccc;
        cursor: pointer;
        font-size: 14px;
        background: white;
      }
      button:hover { background: #f5f5f5; }
      .btn-primary {
        background: #222;
        color: white;
        border-color: #222;
        width: 100%;
        padding: 11px;
        font-size: 15px;
        margin-top: 4px;
      }
      .btn-primary:hover { background: #444; }
      .btn-logout {
        padding: 4px 10px;
        font-size: 12px;
        color: #888;
        border-color: #ddd;
      }
      .btn-yes { border-color: #1a9e60; color: #1a9e60; }
      .btn-no  { border-color: #d94f3d; color: #d94f3d; }

      /* ---- INPUTS ---- */
      .input-full {
        width: 100%;
        padding: 9px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .input-small {
        width: 70px;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      /* ---- BET ROW ---- */
      .bet-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .bet-result {
        font-size: 13px;
        color: #888;
        margin: 8px 0 0;
        min-height: 18px;
      }

      /* ---- LOGIN ---- */
      .login-wrapper {
        max-width: 320px;
        margin: 80px auto;
      }
      .login-wrapper h2 { margin: 0 0 18px; font-size: 18px; }
      .error-msg {
        color: #d94f3d;
        font-size: 13px;
        margin-bottom: 8px;
        min-height: 18px;
      }

      /* ---- LEADERBOARD ---- */
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left;
        font-size: 12px;
        color: #999;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      td { padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
      td.rank { color: #bbb; width: 28px; }
      td.coins { font-weight: bold; text-align: right; }
      tr.me td { color: #1a9e60; }

    </style>
  </head>
  <body>

    <!-- ===================== LOGIN PAGE ===================== -->
    <div id="login-page">
      <div class="card login-wrapper">
        <h2>PolySekunda</h2>
        <input class="input-full" id="username" type="text" placeholder="Username">
        <input class="input-full" id="password" type="password" placeholder="Password">
        <p class="error-msg" id="login-error"></p>
        <button class="btn-primary" onclick="login()">Log in</button>
      </div>
    </div>

    <!-- ===================== MAIN APP ===================== -->
    <div id="main-app" style="display:none;">

      <div class="navbar">
        <h1>PolySekunda</h1>
        <div class="user-info">
          👤 <strong id="logged-in-name"></strong>
          &nbsp;·&nbsp;
          <strong id="balance">1000</strong> coins
          <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
      </div>

      <!-- Market 1 -->
      <div class="card">
        <h2>Will Slovakia beat Czechia?</h2>
        <div class="bet-row">
          <input class="input-small" id="amount1" type="number" value="50" min="1">
          <button class="btn-yes" onclick="bet('result1', 'amount1', 'Yes')">Yes</button>
          <button class="btn-no"  onclick="bet('result1', 'amount1', 'No')">No</button>
        </div>
        <p class="bet-result" id="result1"></p>
      </div>

      <!-- Market 2 -->
      <div class="card">
        <h2>Will our class pass the math test?</h2>
        <div class="bet-row">
          <input class="input-small" id="amount2" type="number" value="50" min="1">
          <button class="btn-yes" onclick="bet('result2', 'amount2', 'Yes')">Yes</button>
          <button class="btn-no"  onclick="bet('result2', 'amount2', 'No')">No</button>
        </div>
        <p class="bet-result" id="result2"></p>
      </div>

      <!-- Leaderboard -->
      <div class="card">
        <h2>Leaderboard</h2>
        <table>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th style="text-align:right">Coins</th>
          </tr>
          <tbody id="leaderboard"></tbody>
        </table>
      </div>

    </div>

    <!-- ===================== JAVASCRIPT ===================== -->
    <script>

      // --- Data ---
      var balance = 1000;
      var currentUser = "";

      var accounts = [
        { name: "adam",  password: "1234" },
        { name: "petra", password: "abcd" },
        { name: "marek", password: "pass" },
      ];

      var players = [
        { name: "adam",  coins: 1000 },
        { name: "petra", coins: 1200 },
        { name: "marek", coins: 600  },
      ];

      // --- Login ---
      function login() {
        var username = document.getElementById("username").value.toLowerCase();
        var password = document.getElementById("password").value;

        var found = null;
        for (var i = 0; i < accounts.length; i++) {
          if (accounts[i].name === username && accounts[i].password === password) {
            found = accounts[i];
          }
        }

        if (found === null) {
          document.getElementById("login-error").textContent = "Wrong username or password.";
          return;
        }

        currentUser = username;
        document.getElementById("logged-in-name").textContent = username;
        document.getElementById("login-page").style.display = "none";
        document.getElementById("main-app").style.display = "block";
        renderLeaderboard();
      }

      // --- Logout ---
      function logout() {
        currentUser = "";
        balance = 1000;
        document.getElementById("main-app").style.display = "none";
        document.getElementById("login-page").style.display = "block";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("login-error").textContent = "";
        document.getElementById("result1").textContent = "";
        document.getElementById("result2").textContent = "";
        document.getElementById("balance").textContent = "1000";
      }

      // --- Place a bet ---
      function bet(resultId, amountId, choice) {
        var amount = parseInt(document.getElementById(amountId).value);

        if (isNaN(amount) || amount <= 0) {
          alert("Enter a valid amount.");
          return;
        }
        if (amount > balance) {
          alert("Not enough coins!");
          return;
        }

        balance -= amount;
        document.getElementById("balance").textContent = balance;
        document.getElementById(resultId).textContent = "You bet " + amount + " coins on " + choice;

        for (var i = 0; i < players.length; i++) {
          if (players[i].name === currentUser) {
            players[i].coins = balance;
          }
        }

        renderLeaderboard();
      }

      // --- Leaderboard ---
      function renderLeaderboard() {
        players.sort(function(a, b) { return b.coins - a.coins; });

        var html = "";
        for (var i = 0; i < players.length; i++) {
          var isMe = players[i].name === currentUser ? "class='me'" : "";
          html += "<tr " + isMe + ">";
          html += "<td class='rank'>" + (i + 1) + "</td>";
          html += "<td>" + players[i].name + "</td>";
          html += "<td class='coins'>" + players[i].coins + "</td>";
          html += "</tr>";
        }

        document.getElementById("leaderboard").innerHTML = html;
      }

    </script>
  </body>
</html>
